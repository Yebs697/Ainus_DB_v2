# Redis 설정 파일

# 네트워크
bind 0.0.0.0
protected-mode no
port 6379

# 일반 설정
daemonize no
pidfile /var/run/redis_6379.pid
loglevel notice
logfile ""

# 데이터 지속성
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# 복제
replica-read-only yes

# 보안 (개발 환경용 - 비밀번호 없음)
# requirepass your_redis_password_here

# 메모리 관리
maxmemory 256mb
maxmemory-policy allkeys-lru

# AOF 설정
appendonly no
appendfilename "appendonly.aof"
appendfsync everysec

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128

# 클라이언트 연결
timeout 300
tcp-keepalive 300
maxclients 1000
